<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>São Paulo - Onde tem feira livre?</title>
    <meta
      name="description"
      content="Encontre feiras livres em São Paulo, consulte os dias de funcionamento e veja informações sobre cada feira."
    />

    <link
      href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <header id="title">
      <h1>São Paulo - Onde tem feira livre?</h1>
    </header>
    <div
      id="map"
      role="application"
      aria-label="Mapa interativo das feiras livres de São Paulo"
    ></div>

    <div id="menu">
      <button id="toggle-button">Desabilitar Camada de Feiras Livres</button>
    </div>

    <div id="legend">
      <button id="legend-toggle" type="button" aria-label="Ocultar legenda">X</button>
      <h4>Dia da semana&nbsp;&nbsp;&nbsp;&nbsp;</h4>
      <button id="legend-select-all" type="button">Alternar Todos</button>

      <div role="group" aria-label="Filtrar feiras por dia da semana">
        <button
          class="legend-item"
          data-day="DOMINGO"
          type="button"
          aria-pressed="true"
        >
          <span class="legend-color" aria-hidden="true"></span>Domingo
        </button>
        <button
          class="legend-item"
          data-day="SEGUNDA-FEIRA"
          type="button"
          aria-pressed="true"
        >
          <span class="legend-color" aria-hidden="true"></span>Segunda-feira
        </button>
        <button
          class="legend-item"
          data-day="TERCA-FEIRA"
          type="button"
          aria-pressed="true"
        >
          <span class="legend-color" aria-hidden="true"></span>Terça-feira
        </button>
        <button
          class="legend-item"
          data-day="QUARTA-FEIRA"
          type="button"
          aria-pressed="true"
        >
          <span class="legend-color" aria-hidden="true"></span>Quarta-feira
        </button>
        <button
          class="legend-item"
          data-day="QUINTA-FEIRA"
          type="button"
          aria-pressed="true"
        >
          <span class="legend-color" aria-hidden="true"></span>Quinta-feira
        </button>
        <button
          class="legend-item"
          data-day="SEXTA-FEIRA"
          type="button"
          aria-pressed="true"
        >
          <span class="legend-color" aria-hidden="true"></span>Sexta-feira
        </button>
        <button class="legend-item" data-day="SABADO" type="button" aria-pressed="true">
          <span class="legend-color" aria-hidden="true"></span>Sábado
        </button>
      </div>
    </div>

    <dialog
      id="event-dialog"
      aria-labelledby="dialog-title"
      aria-describedby="dialog-description"
    >
      <h3 id="dialog-title">Feira Livre</h3>
      <p id="dialog-description">Descricao Feira livre</p>
      <button id="close-dialog" type="button">Fechar</button>
    </dialog>

    <script type="module" src="feira_livre.js"></script>
  </body>
</html>
