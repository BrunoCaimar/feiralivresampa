name: Atualizar dados das feiras livres

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        working-directory: scripts
        run: uv sync --locked

      - name: Download and copy feira data
        working-directory: scripts
        run: uv run --locked python obter_dados_feiras_livres.py

      - name: Commit updated data
        id: commit
        run: |
          git add scripts/data/equipamento_feira_livre.geojson web/data/equipamento_feira_livre.geojson
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dados não foram alterados."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Atualiza os dados das feiras livres"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger GitHub Pages deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "deploy-pages.yml",
              ref: context.payload.repository.default_branch,
            });
